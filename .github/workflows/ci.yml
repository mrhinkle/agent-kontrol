name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:ui
      - run: npm test
      - run: npm run build

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        # The official image, from Amazon's public mirror: Docker Hub rate-limits anonymous pulls from shared runners.
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_PASSWORD: mc
          POSTGRES_DB: mc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:mc@localhost:5432/mc
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply schema (twice, to prove it is idempotent)
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f supabase/schema.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f supabase/schema.sql
      - name: Store tests on plain Postgres
        run: npm run test:pg

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t agent-kontrol:ci .
      - name: Start container in demo mode (no DATABASE_URL) with the password gate on
        run: docker run -d --name ak -p 3000:3000 -e MC_TOKEN=ci-token -e MC_DASHBOARD_PASSWORD=ci-password agent-kontrol:ci
      - name: Wait for /login
        run: |
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/login || true)
            if [ "$code" = "200" ]; then echo "login: $code"; exit 0; fi
            sleep 2
          done
          echo "login never returned 200 (last: $code)"; docker logs ak; exit 1
      - name: Data endpoint rejects a request without the token
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/fleet)
          echo "fleet (no token): $code"; [ "$code" = "401" ]
      - name: Data endpoint answers with the token
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer ci-token' http://127.0.0.1:3000/api/fleet)
          echo "fleet (token): $code"; [ "$code" = "200" ]
      - name: Container logs
        if: always()
        run: docker logs ak
