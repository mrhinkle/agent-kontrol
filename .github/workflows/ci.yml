name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run test:ui
      - run: pnpm test
      - name: Claude Reviewer runner tests (#176)
        run: python3 -m unittest tests.unit.test_claude_reviewer -v
      - run: pnpm run test:mcp
      - run: pnpm run build
      - name: Bridge, dispatcher and broker tests and syntax (Python 3.9, #212)
        # The full image, not -slim: the dispatcher tests build real git worktrees. From Google's
        # Docker Hub mirror, for the rate-limit reason given on the postgres job.
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/w" -w /w
          mirror.gcr.io/library/python:3.9-bookworm
          sh -ec "python3.9 -m unittest -v tests.unit.test_dispatcher_bridge tests.unit.test_dispatch_ready_bridge
          tests.unit.test_bridge_e2e
          tests.unit.test_ak_stop_control tests.unit.test_dispatcher_skills tests.unit.test_dispatcher_stream
          tests.unit.test_broker_audit tests.unit.test_broker_dispatcher tests.unit.test_broker_github
          tests.unit.test_broker_lane_user tests.unit.test_broker_providers tests.unit.test_broker_proxy
          && python3.9 -m py_compile agents/dispatcher/*.py agents/broker/*.py scripts/run-bridge-e2e.py"
      - name: Stop control virtual tests in a private PID namespace (#211)
        # From Google's Docker Hub mirror, for the rate-limit reason given on the postgres job. The runner
        # itself refuses to pull, so the image is fetched and tagged here first.
        run: |
          docker pull mirror.gcr.io/library/python:3.12-bookworm
          docker tag mirror.gcr.io/library/python:3.12-bookworm python:3.12-bookworm
          sh tests/unit/run_ak_stop_control_virtual.sh
      - name: Lane user checker syntax (#193)
        run: bash -n agents/dispatcher/lane-user-check.sh
      - name: Lane user checker shellcheck (#193)
        run: shellcheck agents/dispatcher/lane-user-check.sh

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        # The official image, from Google's Docker Hub mirror: Docker Hub rate-limits anonymous pulls from shared
        # runners, and Amazon's public ECR mirror began returning "Data limit exceeded" on 2026-10-28.
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_PASSWORD: mc
          POSTGRES_DB: mc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:mc@localhost:5432/mc
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Full history: the bridge e2e runner hard-fails unless BASE_SHA is an ancestor of HEAD (#213 M3).
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply schema (twice, to prove it is idempotent)
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f supabase/schema.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f supabase/schema.sql
      - name: Store tests on plain Postgres
        run: pnpm run test:pg
      - name: Bridge end-to-end proof against the real API and Postgres (#213, epic #62)
        # Tier C, owner-approved for throwaway CI containers only: bridge mode runs here against a
        # loopback Next server with a token generated for this step. `next start` ignores HOSTNAME,
        # so the bind is -H 127.0.0.1; a production build with a database also needs a dashboard
        # password, generated and thrown away the same way.
        run: |
          set -euo pipefail
          export RUN_ID="ci-${GITHUB_RUN_ID}" REPORT_DIR="$PWD/bridge-e2e-report"
          MC_TOKEN="$(python3 -c 'import secrets;print(secrets.token_urlsafe(32))')"; export MC_TOKEN
          MC_DASHBOARD_PASSWORD="$(python3 -c 'import secrets;print(secrets.token_urlsafe(32))')"; export MC_DASHBOARD_PASSWORD
          echo "::add-mask::$MC_TOKEN"; echo "::add-mask::$MC_DASHBOARD_PASSWORD"
          pnpm run build
          PORT=3999 NEXT_TELEMETRY_DISABLED=1 nohup pnpm start -H 127.0.0.1 >"$RUNNER_TEMP/next.log" 2>&1 &
          ok=0; for _ in $(seq 1 60); do curl -fsS -H "Authorization: Bearer $MC_TOKEN" "http://127.0.0.1:3999/api/tasks?status=all" >/dev/null && { ok=1; break; }; sleep 2; done; [ "$ok" = 1 ] || exit 1
          MC_URL=http://127.0.0.1:3999 pnpm run test:bridge-e2e
          python3 -m py_compile scripts/run-bridge-e2e.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: bridge-e2e-report, path: bridge-e2e-report/ }

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t agent-kontrol:ci .
      - name: Start container in demo mode (no DATABASE_URL) with the password gate on
        run: docker run -d --name ak -p 3000:3000 -e MC_TOKEN=ci-token -e MC_DASHBOARD_PASSWORD=ci-password agent-kontrol:ci
      - name: Wait for /login
        run: |
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/login || true)
            if [ "$code" = "200" ]; then echo "login: $code"; exit 0; fi
            sleep 2
          done
          echo "login never returned 200 (last: $code)"; docker logs ak; exit 1
      - name: Data endpoint rejects a request without the token
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/fleet)
          echo "fleet (no token): $code"; [ "$code" = "401" ]
      - name: Data endpoint answers with the token
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer ci-token' http://127.0.0.1:3000/api/fleet)
          echo "fleet (token): $code"; [ "$code" = "200" ]
      - name: Container logs
        if: always()
        run: docker logs ak
