# Fly.io configuration for Agent Kontrol.
#
# First deploy (pick your own app name and region):
#   fly launch --copy-config --no-deploy --name <your-app> --region <region>
#   fly secrets set MC_TOKEN=... MC_DASHBOARD_PASSWORD=... DATABASE_URL=... MC_PUBLIC_URL=https://<your-app>.fly.dev
#   fly deploy
#
# Full walkthrough: docs/DEPLOY.md, section "Deploy to Fly.io".

app = "agent-kontrol"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Applies supabase/schema.sql once per deploy, before the new machines start.
  # Idempotent, so it is safe to run on every release.
  release_command = "node scripts/apply-schema.mjs"

[env]
  PORT = "3000"
  NEXT_TELEMETRY_DISABLED = "1"
  # The release command above already applied the schema; skip the
  # per-container run that the Dockerfile does for Docker Compose.
  MC_SKIP_MIGRATE = "1"

[http_service]
  internal_port = 3000
  force_https = true
  # Keep one machine warm: agents push status and poll for tasks around the
  # clock, and MCP clients do not tolerate cold starts well.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/login"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
