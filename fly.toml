# Fly.io configuration for Agent Kontrol.
#
# First deploy (pick your own app name and region):
#   fly launch --copy-config --no-deploy --name <your-app> --region <region>
#   fly secrets set MC_TOKEN=... MC_DASHBOARD_PASSWORD=... DATABASE_URL=... MC_PUBLIC_URL=https://<your-app>.fly.dev
#   fly deploy
#
# Full walkthrough: docs/DEPLOY.md, section "Deploy to Fly.io".

app = "agent-kontrol"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Applies supabase/schema.sql once per deploy, before the new machines start.
  # Idempotent, so it is safe to run on every release. The release machine
  # inherits [env], so MC_SKIP_MIGRATE is overridden here or the step would skip.
  release_command = "env MC_SKIP_MIGRATE=0 node scripts/apply-schema.mjs"

[env]
  PORT = "3000"
  NEXT_TELEMETRY_DISABLED = "1"
  # The release command above already applied the schema; skip the
  # duplicate run the Dockerfile CMD does at container start (that run is
  # what Docker Compose relies on; on Fly it is redundant).
  MC_SKIP_MIGRATE = "1"

[http_service]
  internal_port = 3000
  force_https = true
  # Never stop the machine: agents push status and poll for tasks around the
  # clock, and MCP clients do not tolerate cold starts well. (With auto-stop
  # off, min_machines_running has no effect, so it is not set.)
  auto_stop_machines = "off"
  auto_start_machines = true
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/login"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
